name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run all Swift tests
        run: swift test
      - name: Build and verify local development app
        run: bash macos/build_app.sh
      - name: Check patch whitespace
        run: git diff --check
